<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Prediction | Predictive Maintenance</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #172033;
            min-height: 100vh;
        }

        .container {
            width: 900px;
            max-width: 92%;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .header p {
            color: #667085;
            font-size: 15px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
            color: #172033;
        }

        input,
        select {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccd3df;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            background: white;
        }

        input:focus,
        select:focus {
            border-color: #172033;
        }

        .predict-btn {
            width: 100%;
            margin-top: 28px;
            padding: 17px;
            border: none;
            border-radius: 10px;
            background: #172033;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .predict-btn:hover {
            background: #253452;
        }

        .predict-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* RESULT */

        .result {
            display: none;
            margin-top: 30px;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid #d9dee8;
        }

        .result-icon {
            font-size: 45px;
            margin-bottom: 10px;
        }

        .probability-label {
            font-size: 18px;
            color: #555;
        }

        .probability {
            font-size: 48px;
            font-weight: bold;
            margin: 8px 0 18px;
        }

        .risk {
            display: inline-block;
            padding: 9px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .status {
            font-size: 22px;
            font-weight: bold;
            margin-top: 8px;
        }

        .message {
            margin-top: 10px;
            color: #667085;
            font-size: 15px;
        }

        /* LOW */

        .low {
            background: #ecfdf3;
            border-color: #a7f3d0;
        }

        .low .risk {
            background: #22c55e;
            color: white;
        }

        .low .probability,
        .low .status {
            color: #15803d;
        }

        /* MEDIUM */

        .medium {
            background: #fff7ed;
            border-color: #fed7aa;
        }

        .medium .risk {
            background: #f59e0b;
            color: white;
        }

        .medium .probability,
        .medium .status {
            color: #c2410c;
        }

        /* HIGH */

        .high {
            background: #fef2f2;
            border-color: #fecaca;
        }

        .high .risk {
            background: #ef4444;
            color: white;
        }

        .high .probability,
        .high .status {
            color: #dc2626;
        }

        .back-btn {
            display: block;
            width: fit-content;
            margin: 25px auto 0;
            padding: 11px 20px;
            border: 1px solid #ccd3df;
            border-radius: 9px;
            text-decoration: none;
            color: #172033;
            background: white;
        }

        .back-btn:hover {
            background: #f1f4f8;
        }

        .error {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            border-radius: 10px;
            text-align: center;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">
        <h1>🤖 AI Machine Failure Prediction</h1>
        <p>Enter machine sensor values to predict failure risk</p>
    </div>


    <!-- INPUT FORM -->

    <form id="predictionForm">

        <div class="form-grid">

            <div class="input-group">
                <label for="machineType">Machine Type</label>

                <select id="machineType" required>
                    <option value="">Select Type</option>
                    <option value="L">L - Low</option>
                    <option value="M">M - Medium</option>
                    <option value="H">H - High</option>
                </select>
            </div>


            <div class="input-group">
                <label for="airTemperature">
                    Air Temperature (K)
                </label>

                <input
                    type="number"
                    id="airTemperature"
                    step="0.1"
                    value="300"
                    required
                >
            </div>


            <div class="input-group">
                <label for="processTemperature">
                    Process Temperature (K)
                </label>

                <input
                    type="number"
                    id="processTemperature"
                    step="0.1"
                    value="310"
                    required
                >
            </div>


            <div class="input-group">
                <label for="rotationalSpeed">
                    Rotational Speed (rpm)
                </label>

                <input
                    type="number"
                    id="rotationalSpeed"
                    value="1500"
                    required
                >
            </div>


            <div class="input-group">
                <label for="torque">
                    Torque (Nm)
                </label>

                <input
                    type="number"
                    id="torque"
                    step="0.1"
                    value="50"
                    required
                >
            </div>


            <div class="input-group">
                <label for="toolWear">
                    Tool Wear (min)
                </label>

                <input
                    type="number"
                    id="toolWear"
                    value="180"
                    required
                >
            </div>

        </div>


        <button
            type="submit"
            class="predict-btn"
            id="predictButton"
        >
            🔮 Predict Machine Failure
        </button>

    </form>


    <!-- ERROR -->

    <div class="error" id="errorBox"></div>


    <!-- RESULT -->

    <div class="result" id="resultBox">

        <div class="result-icon" id="resultIcon">
            🟢
        </div>

        <div class="probability-label">
            Failure Probability
        </div>

        <div class="probability" id="probability">
            --
        </div>

        <div class="risk" id="risk">
            --
        </div>

        <div class="status" id="status">
            --
        </div>

        <div class="message" id="message">
            --
        </div>

    </div>


    <!-- BACK -->

    <a href="dashboard.html" class="back-btn">
        ← Back to Dashboard
    </a>

</div>


<script>

    // ==========================================
    // FORM
    // ==========================================

    const form = document.getElementById("predictionForm");

    const predictButton =
        document.getElementById("predictButton");

    const resultBox =
        document.getElementById("resultBox");

    const errorBox =
        document.getElementById("errorBox");

    const probabilityElement =
        document.getElementById("probability");

    const riskElement =
        document.getElementById("risk");

    const statusElement =
        document.getElementById("status");

    const messageElement =
        document.getElementById("message");

    const resultIcon =
        document.getElementById("resultIcon");


    // ==========================================
    // PREDICTION
    // ==========================================

    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        // Hide previous messages

        errorBox.style.display = "none";
        resultBox.style.display = "none";

        // Disable button

        predictButton.disabled = true;
        predictButton.innerText = "⏳ Predicting...";


        // ==========================================
        // GET INPUT VALUES
        // ==========================================

        const machineType =
            document.getElementById("machineType").value;

        const airTemperature =
            parseFloat(
                document.getElementById("airTemperature").value
            );

        const processTemperature =
            parseFloat(
                document.getElementById("processTemperature").value
            );

        const rotationalSpeed =
            parseFloat(
                document.getElementById("rotationalSpeed").value
            );

        const torque =
            parseFloat(
                document.getElementById("torque").value
            );

        const toolWear =
            parseFloat(
                document.getElementById("toolWear").value
            );


        // ==========================================
        // SEND TO FASTAPI
        // ==========================================

        try {

            const response = await fetch(
                "http://127.0.0.1:8000/predict",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        machine_type: machineType,

                        air_temperature:
                            airTemperature,

                        process_temperature:
                            processTemperature,

                        rotational_speed:
                            rotationalSpeed,

                        torque:
                            torque,

                        tool_wear:
                            toolWear

                    })
                }
            );


            // ==========================================
            // CHECK RESPONSE
            // ==========================================

            if (!response.ok) {

                throw new Error(
                    "Server returned an error: " +
                    response.status
                );

            }


            const data = await response.json();


            // Backend error

            if (data.error) {

                throw new Error(data.error);

            }


            // ==========================================
            // GET RESULT
            // ==========================================

            const failureProbability =
                Number(data.failure_probability);


            const riskLevel =
                data.risk_level;


            const machineStatus =
                data.status;


            const message =
                data.message;


            // ==========================================
            // DISPLAY PROBABILITY
            // ==========================================

            probabilityElement.innerText =
                failureProbability.toFixed(2) + "%";


            // ==========================================
            // RESET RESULT CLASS
            // ==========================================

            resultBox.classList.remove(
                "low",
                "medium",
                "high"
            );


            // ==========================================
            // RISK LEVEL
            // ==========================================

            if (riskLevel === "LOW") {

                resultBox.classList.add("low");

                resultIcon.innerText = "🟢";

                riskElement.innerText =
                    "LOW RISK";

                statusElement.innerText =
                    "MACHINE NORMAL";

            }

            else if (riskLevel === "MEDIUM") {

                resultBox.classList.add("medium");

                resultIcon.innerText = "🟠";

                riskElement.innerText =
                    "MEDIUM RISK";

                statusElement.innerText =
                    "MACHINE NEEDS ATTENTION";

            }

            else {

                resultBox.classList.add("high");

                resultIcon.innerText = "🔴";

                riskElement.innerText =
                    "HIGH RISK";

                statusElement.innerText =
                    "MACHINE FAILURE LIKELY";

            }


            // ==========================================
            // MESSAGE
            // ==========================================

            messageElement.innerText =
                message;


            // ==========================================
            // SHOW RESULT
            // ==========================================

            resultBox.style.display = "block";


            // ==========================================
            // SAVE HISTORY
            // ==========================================

            savePredictionHistory({

                machine_type: machineType,

                air_temperature:
                    airTemperature,

                process_temperature:
                    processTemperature,

                rotational_speed:
                    rotationalSpeed,

                torque:
                    torque,

                tool_wear:
                    toolWear,

                failure_probability:
                    failureProbability,

                risk_level:
                    riskLevel,

                status:
                    machineStatus,

                timestamp:
                    new Date().toLocaleString()

            });

        }

        catch (error) {

            console.error(
                "Prediction Error:",
                error
            );


            errorBox.innerText =
                "Prediction failed: " +
                error.message;


            errorBox.style.display = "block";

        }


        finally {

            predictButton.disabled = false;

            predictButton.innerText =
                "🔮 Predict Machine Failure";

        }

    });


    // ==========================================
    // SAVE HISTORY
    // ==========================================

    function savePredictionHistory(record) {

        let history = [];

        try {

            history =
                JSON.parse(
                    localStorage.getItem(
                        "predictionHistory"
                    )
                ) || [];

        }

        catch {

            history = [];

        }


        history.unshift(record);


        // Keep latest 50 predictions

        history =
            history.slice(0, 50);


        localStorage.setItem(
            "predictionHistory",
            JSON.stringify(history)
        );

    }

</script>

</body>
</html>
